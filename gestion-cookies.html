<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><title>Cookies | NG PLOMBERIE</title><link rel="canonical" href="https://ng-plomberie.fr/gestion-cookies/"><style>*{box-sizing:border-box;margin:0;padding:0}body{font-family:system-ui,sans-serif;line-height:1.6;color:#1a1a1a}.container{max-width:800px;margin:auto;padding:40px 20px}.card{background:#fff;padding:32px;border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,0.05)}h1{margin-bottom:20px}fieldset{border:1px solid #eee;padding:16px;margin:16px 0;border-radius:8px}label{display:flex;gap:8px;align-items:center;margin:12px 0}.btn{padding:12px 24px;border:none;border-radius:8px;font-weight:600;cursor:pointer;margin:8px}.btn-primary{background:#28a745;color:#fff}.btn-refuse{background:#e9ecef;color:#333}</style></head><body><main class="container"><div class="card"><h1>Gestion des cookies</h1><form id="cp"><fieldset><legend>🔒 Essentiels (toujours actifs)</legend><p>Nécessaires au fonctionnement, sécurité, consentement.</p></fieldset><fieldset><legend>📊 Analyse</legend><label><input type="checkbox" name="analytics"> Google Analytics 4 (anonymisé)</label></fieldset><fieldset><legend>🎯 Marketing</legend><label><input type="checkbox" name="marketing"> Google Ads, Remarketing</label></fieldset><div style="text-align:center;margin-top:16px"><button type="button" class="btn btn-refuse" id="rall">Tout refuser</button><button type="submit" class="btn btn-primary">Enregistrer</button></div></form></div></main><script>document.getElementById('cp').addEventListener('submit',e=>{e.preventDefault();localStorage.setItem('ngp_cookie','custom');alert('✅ Préférences enregistrées');location.href='/'})</script></body></html>
